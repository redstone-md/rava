[workspace]
resolver = "2"
members = ["crates/rava"]

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

# `release` with symbols, for profiling (perf); never for timing verdicts.
[profile.release-diag]
inherits = "release"
strip = "none"
debug = 1
