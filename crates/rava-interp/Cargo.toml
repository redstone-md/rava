[package]
name = "rava-interp"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# next-gen-gc: OPT-IN (default OFF → normal build is byte-identical). Compiles the
# `nextgen` arena/nursery allocator into the tree as the integration foundation
# (proven in crates/sandbox-gc: Allocs 0.87x JVM single-thread, 4x via TLAB).
# Hot-path wiring (new_object→TLAB, GC-root codegen) is staged behind this flag;
# until wired it is dead code, so the default engine and McProbe baseline are
# untouched.
[features]
# Population census for the collection-contract paths (docs/boot-speed-ledger.md
# rows 261-262). Off by default: the counters sit on paths that run millions of
# times a boot, so the product must not pay for an instrument it is not reading.
contract-stat = []
default = ["shrink-header"]
# next-gen-gc pulls in crossbeam-deque for the Kit-1 GIL-free work-stealing pool
# (parallel_pool). Optional dep → the DEFAULT build's dependency set is unchanged.
next-gen-gc = ["dep:crossbeam-deque"]
# Wall-time sampling is a diagnostic build capability, not production runtime work.
# The default module is an inlined no-op API; enable this feature to build an artifact
# that honours RAVA_PROFILE_WALL / RAVA_PROFILE_PC and emits sampler reports.
wall-profile = []
# Opt-in initializer CPU attribution. Both the VM callsite and reporter are absent from default builds.
clinit-census = []
# shrink-header: DEFAULT ON since 2026-07-25 — measured on the real MC boot, paired and
# interleaved, EVERY 16B run beating EVERY 24B run: Done 106.033/107.669s vs 109.070/118.900s
# (−6.3%) and peak working set 963-965 MiB vs 1030-1034 MiB (−68 MiB, −6.6%, reproducible to
# ~2 MiB). The header was 43-50% of live arena bytes (mean 3.98 cells/object). It transfers
# where three body-duplicating optimisations did not, for the reason this codebase's boot
# demands: zero added instructions, one FEWER store per allocation, less memory traffic.
# Opt out with --no-default-features (plus the features you still want) to A/B it back.
# Narrows the arena object header 24B → 16B by
# storing the GC forwarding target as a u32 ARENA-RELATIVE CELL OFFSET packed into the
# same 8-byte word as the (u32) identity hash, reclaiming half a pointer + the 4 bytes
# of tail padding. NOT an overlay: class id and nfields keep their own words, so every
# reader that inspects a possibly-forwarded object's header (arena_obj_header_plausible,
# forward_stale_arena, stale_young_ptr) is unaffected, and 0 keeps its exact "not
# forwarded" meaning. HDR is a compile-time const baked into JIT codegen, so this
# CANNOT be a runtime env flag — it is a second binary, A/B'd by rebuilding.
shrink-header = []

[dependencies]
rava-classfile = { path = "../rava-classfile" }
crossbeam-deque = { version = "0.8", optional = true }
rava-jar = { path = "../rava-jar" }
serde = { version = "1", features = ["derive", "rc"] }
smallvec = { version = "1", features = ["serde", "union"] }
bincode = "1.3"
regex = "1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
digest = "0.10"
# ⭐**THE JAR INFLATE IS THE LARGEST SINGLE BYTE-PROCESSING JOB IN THE BOOT, AND IT WAS RUNNING
# ON A SCALAR DECODER.** A boot inflates ~100 MB out of the classpath: ~15,000 classfiles plus
# every datapack resource, all of it through `zip`'s `DeflateDecoder`, which is `flate2`.
# `flate2`'s default backend is `miniz_oxide` — a straight scalar port of miniz.c, no SIMD
# anywhere in its inflate loop. `zlib-rs` is the rewrite of zlib that carries hand-written
# vector code exactly where DEFLATE can use it: SSE2/AVX2 chunked window copies for the LZ77
# back-references (the inner loop of inflate, and the one `miniz_oxide` does a byte at a time),
# PCLMULQDQ CRC-32 for the per-entry integrity check, and SIMD adler32 for zlib-framed streams.
# It is pure Rust with ZERO non-dev dependencies and no C toolchain — no cmake, no `libz-sys`,
# nothing to break an MSVC build — which is why this and not `zlib-ng`.
#
# BIT-IDENTICAL BY THE FORMAT, NOT BY RESEMBLANCE: DEFLATE decompression is a total function of
# the compressed stream (RFC 1951), so every conformant inflate emits the same bytes; CRC-32 is
# likewise a fixed function. Only COMPRESSION output may differ between backends, and the sole
# compressor in this engine is the guest-facing `GZIPOutputStream`/`Deflater` shim, whose bytes
# no gate hashes and which already differed from HotSpot's zlib.
#
# ⚠NO RUNTIME KILL SWITCH IS POSSIBLE — a Cargo feature is selected at compile time, and it is
# `zip`'s decoder (not our code) that changes. To revert, drop `features` here: `flate2` falls
# back to `rust_backend`/`miniz_oxide` and `zlib-rs` leaves the graph entirely.
#
# Feature unification is what makes this reach `zip`: `rava-jar` pulls `flate2/rust_backend`
# via `zip/deflate`, and `flate2` gates its backends so that `any_zlib` (set by `zlib-rs`)
# switches `ffi` to the zlib-rs module and compiles the `miniz_oxide` one out. One `flate2` in
# the graph ⇒ one backend ⇒ the jar reader gets it too.
flate2 = { version = "1.1.9", features = ["zlib-rs"] }
rayon = "1.10"
cranelift = "0.132"
cranelift-jit = "0.132"
cranelift-module = "0.132"
cranelift-native = "0.132"
