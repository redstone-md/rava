name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.0.2-alpha (made at the dispatched commit if it does not exist)"
        required: true
      replace:
        description: "Delete an existing release of this tag and its tag first (rebuilds it at the dispatched commit)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Archives go straight into a draft release (no workflow artifacts, which count against the
  # account's storage); the release is published only when every build has passed its checks.
  draft:
    name: Draft
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Drafts of this tag that earlier runs left behind.
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.draft and (.tag_name | startswith(\"$TAG-draft-\"))) | .id" |
            while read -r old; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$old"; done
          # Under a tag of its own (a draft makes no tag) while a release of $TAG may still exist.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG-draft-$GITHUB_RUN_ID" -f target_commitish="$GITHUB_SHA" -f name="rava $TAG" -F draft=true --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: draft
    strategy:
      fail-fast: true
      matrix:
        include:
          # The oldest supported Linux runner: the binary then runs on glibc 2.35 and newer.
          - { os: ubuntu-22.04, platform: linux-x86_64, cc: cc }
          - { os: macos-15-intel, platform: macos-x86_64, cc: cc }
          - { os: windows-2022, platform: windows-x86_64, cc: gcc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # The tag's commit on a tag push; on a manual run, the dispatched branch's head, where the
      # release then creates the tag.
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Supplies the Java class library each distribution ships (OpenJDK, GPLv2 with the
      # Classpath Exception; its legal notices travel in legal/).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Check the tag against the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/rava/Cargo.toml | head -1)
          [ "v$version" = "$TAG" ] || { echo "::error::tag $TAG does not match crate version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the distribution
        run: |
          name="rava-$VERSION-${{ matrix.platform }}"
          dist/make.sh "$JAVA_HOME" "$PWD/dist/out/$name"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - name: Smoke test
        run: |
          rava="dist/out/$NAME/bin/rava"
          "$rava" -version
          printf 'public class Hello { public static void main(String[] a) { System.out.println("Hello from " + System.getProperty("java.vm.name") + " " + System.getProperty("java.vm.version") + " on " + System.getProperty("os.name")); } }\n' > Hello.java
          "$rava" Hello.java

      - name: Checks against HotSpot
        run: R="$PWD/dist/out/$NAME/bin/rava" SEM_DIFF=1 CC=${{ matrix.cc }} tests/check.sh

      - name: Checksum
        working-directory: dist/out
        run: |
          # The one archive this system makes: tar.gz on Linux and macOS, zip on Windows.
          archive=$NAME.tar.gz
          [ -f "$archive" ] || archive=$NAME.zip
          { sha256sum "$archive" 2>/dev/null || shasum -a 256 "$archive"; } > "$archive.sha256"
          cat "$archive.sha256"

      - name: Upload to the draft
        working-directory: dist/out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in "$NAME".tar.gz "$NAME".zip "$NAME".*.sha256; do
            [ -f "$f" ] || continue
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @"$f" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/${{ needs.draft.outputs.id }}/assets?name=$f" > /dev/null
            echo "uploaded $f"
          done

  publish:
    name: Publish
    needs: [draft, build]
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      ID: ${{ needs.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download the archives
        run: |
          mkdir -p dist/out
          gh api "repos/$GITHUB_REPOSITORY/releases/$ID/assets" --jq '.[] | "\(.id) \(.name)"' | while read -r asset name; do
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > "dist/out/$name"
          done
          ls -l dist/out

      - name: Release notes
        run: python3 .github/scripts/release_notes.py "$TAG" dist/out/*.tar.gz dist/out/*.zip > dist/out/notes.md

      # Only now, with the new one complete: the old release and its tag go.
      - name: Replace the existing release
        if: inputs.replace
        run: |
          old=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id 2>/dev/null) && gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$old" || echo "no release $TAG to replace"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" || echo "no tag $TAG"

      - name: Publish
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
            -F body=@dist/out/notes.md -F draft=false -F prerelease=${{ contains(env.TAG, '-') }} --jq .html_url

  discard:
    name: Discard the draft
    needs: [draft, build]
    if: (failure() || cancelled()) && needs.draft.outputs.id != ''
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/${{ needs.draft.outputs.id }}"
