name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.0.2-alpha (made at the dispatched commit if it does not exist)"
        required: true
      replace:
        description: "Delete an existing release of this tag and its tag first (rebuilds it at the dispatched commit)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        include:
          # The oldest supported Linux runner: the binary then runs on glibc 2.35 and newer.
          - { os: ubuntu-22.04, platform: linux-x86_64, cc: cc }
          - { os: macos-15-intel, platform: macos-x86_64, cc: cc }
          - { os: windows-2022, platform: windows-x86_64, cc: gcc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # The tag's commit on a tag push; on a manual run, the dispatched branch's head, where the
      # release then creates the tag.
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Supplies the Java class library each distribution ships (OpenJDK, GPLv2 with the
      # Classpath Exception; its legal notices travel in legal/).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Check the tag against the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/rava/Cargo.toml | head -1)
          [ "v$version" = "$TAG" ] || { echo "::error::tag $TAG does not match crate version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the distribution
        run: |
          name="rava-$VERSION-${{ matrix.platform }}"
          dist/make.sh "$JAVA_HOME" "$PWD/dist/out/$name"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - name: Smoke test
        run: |
          rava="dist/out/$NAME/bin/rava"
          "$rava" -version
          printf 'public class Hello { public static void main(String[] a) { System.out.println("Hello from " + System.getProperty("java.vm.name") + " " + System.getProperty("java.vm.version") + " on " + System.getProperty("os.name")); } }\n' > Hello.java
          "$rava" Hello.java

      - name: Checks against HotSpot
        run: R="$PWD/dist/out/$NAME/bin/rava" SEM_DIFF=1 CC=${{ matrix.cc }} tests/check.sh

      - name: Checksum
        working-directory: dist/out
        run: |
          # The one archive this system makes: tar.gz on Linux and macOS, zip on Windows.
          archive=$NAME.tar.gz
          [ -f "$archive" ] || archive=$NAME.zip
          { sha256sum "$archive" 2>/dev/null || shasum -a 256 "$archive"; } > "$archive.sha256"
          cat "$archive.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            dist/out/*.tar.gz
            dist/out/*.zip
            dist/out/*.sha256

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist/out
          merge-multiple: true

      - name: Release notes
        run: python3 .github/scripts/release_notes.py "$TAG" dist/out/*.tar.gz dist/out/*.zip > dist/out/notes.md

      - name: Replace the existing release
        if: inputs.replace
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$TAG" --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || echo "no release $TAG to replace"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: rava ${{ env.TAG }}
          body_path: dist/out/notes.md
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            dist/out/*.tar.gz
            dist/out/*.zip
            dist/out/*.sha256
