name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The class library rava runs, and HotSpot as the reference the probes compare against.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Unit tests
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Semantics, JNI and patches against HotSpot
        run: tests/check.sh
        env:
          SEM_DIFF: "1"
          # The JNI test's library: MinGW's gcc on Windows runners.
          CC: ${{ runner.os == 'Windows' && 'gcc' || 'cc' }}
