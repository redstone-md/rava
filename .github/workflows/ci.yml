name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The class library rava runs, and HotSpot as the reference the probes compare against.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Unit tests
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Semantics, JNI and patches against HotSpot
        run: tests/check.sh
        env:
          SEM_DIFF: "1"
