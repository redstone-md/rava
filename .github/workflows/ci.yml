name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # What the release builds: a portable x86-64 baseline instead of target-cpu=native, so cached
  # objects from one runner never carry instructions another runner's processor lacks.
  RUSTFLAGS: -C target-cpu=x86-64-v2

jobs:
  check:
    name: Build and check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # 22.04: the oldest glibc the release supports, and the system it is built on.
        os: [ubuntu-24.04, ubuntu-22.04, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The class library rava runs, and HotSpot as the reference the probes compare against.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Unit tests
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Semantics, JNI and patches against HotSpot
        run: tests/check.sh
        env:
          SEM_DIFF: "1"
          # The JNI test's library: MinGW's gcc on Windows runners.
          CC: ${{ runner.os == 'Windows' && 'gcc' || 'cc' }}
